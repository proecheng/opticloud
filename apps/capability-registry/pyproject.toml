[project]
name = "opticloud-capability-registry"
version = "0.0.1"
description = "OptiCloud Capability Registry — v1 provider/capability schema reservation (Story 7.A.1)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.5",
  "redis>=5.0",
  "prometheus-client>=0.21",
  "structlog>=24.1",
  "opticloud-shared",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[tool.uv.sources]
opticloud-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capability_registry"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
