# OptiCloud RFC 7807 error message single source (zh-CN).
# Add new user-facing error text here before referencing remediation_hint_key
# from production problem-detail code.

errors:
  400:
    billing_http_error:
      title: "计费请求无效"
      detail: "计费服务拒绝了当前请求。"
      remediation: "检查请求字段、幂等键和计费上下文后重试。"
    invalid_benchmark_library_option:
      title: "经典算例库选项无效"
      detail: "经典算例库导入选项未通过校验。"
      remediation: "选择已发布且可导入的经典算例后重试。"
    invalid_json:
      title: "JSON 格式无效"
      detail: "请求体不是有效的 JSON。"
      remediation: "修正 JSON 语法后重新提交。"
    unsupported_fallback_solver:
      title: "不支持的备用求解器"
      detail: "fallback_chain 中存在不支持的求解器。"
      remediation: "从算法目录中选择当前 task_type 支持的备用求解器。"
    unsupported_solver:
      title: "不支持的求解器"
      detail: "当前 task_type 不支持指定求解器。"
      remediation: "查看算法目录并选择支持的 solver。"
  401:
    authorization_required:
      title: "需要认证"
      detail: "请求缺少有效认证信息。"
      remediation: "提供有效 API Key 或重新登录后重试。"
    billing_http_error:
      title: "计费认证失败"
      detail: "计费服务无法验证当前请求身份。"
      remediation: "检查认证头或内部服务认证配置后重试。"
  402:
    billing_http_error:
      title: "计费支付条件未满足"
      detail: "计费服务要求补足 Credits 或支付条件。"
      remediation: "前往充值页补足 Credits 后重试。"
    topup:
      title: "Credits 不足"
      detail: "当前 Credits 余额不足，无法完成本次请求。"
      remediation: "前往充值页补足 Credits 后重试。"
  403:
    billing_http_error:
      title: "计费权限不足"
      detail: "当前账户或套餐无权执行该计费操作。"
      remediation: "确认账户权限或升级套餐后重试。"
    insufficient_scope:
      title: "权限不足"
      detail: "当前 API Key 缺少执行此操作所需的 scope。"
      remediation: "创建或切换具备所需 scope 的 API Key。"
    unaudited_self_algorithm:
      title: "自研算法未完成审计"
      detail: "自研算法在审计通过前不可用于该请求。"
      remediation: "完成自研算法审计，或选择已审计的算法。"
  404:
    billing_http_error:
      title: "计费资源不存在"
      detail: "请求的计费资源不存在或不可见。"
      remediation: "确认资源 ID、账户和权限后重试。"
    not_found:
      title: "资源不存在"
      detail: "请求的资源不存在或当前账户不可见。"
      remediation: "确认资源 ID 和访问权限后重试。"
  409:
    billing_http_error:
      title: "计费请求冲突"
      detail: "计费请求与现有状态或幂等记录冲突。"
      remediation: "检查幂等键、账单状态或预算状态后重试。"
    cancellation_not_allowed:
      title: "不允许取消"
      detail: "当前任务状态不允许取消。"
      remediation: "仅对 queued 或 in_progress 状态的任务发起取消。"
    idempotency_body_mismatch:
      title: "幂等键冲突"
      detail: "同一幂等键被用于不同请求内容。"
      remediation: "保持请求体一致，或使用新的 Idempotency-Key。"
    monthly_budget_paused:
      title: "月度预算已暂停"
      detail: "当前账户因月度预算规则暂停了计费请求。"
      remediation: "调整预算设置或等待新预算周期后重试。"
    provider_migration_required:
      title: "需要 Provider 迁移"
      detail: "复现凭证锁定的 Provider 需要迁移，但当前没有匹配的活跃等效 Provider。"
      remediation: "确认锁定 Provider、任务类型、求解器和能力标签后再重试。"
    rerun_not_allowed:
      title: "不允许重新运行"
      detail: "该复现凭证或源任务不满足重新运行条件。"
      remediation: "确认凭证状态、所有权和复现窗口后重试。"
  410:
    voucher_expired:
      title: "复现凭证已过期"
      detail: "该复现凭证已超过允许的重新运行窗口。"
      remediation: "使用仍在有效期内的复现凭证。"
  422:
    anonymous_requires_reproducible:
      title: "匿名选项无效"
      detail: "匿名凭证要求同时启用 reproducible。"
      remediation: "设置 options.reproducible=true 后再启用匿名。"
    billing_http_error:
      title: "计费请求未通过校验"
      detail: "计费请求字段或业务规则未通过校验。"
      remediation: "检查字段路径、取值范围和计费状态后重试。"
    billing_not_supported_for_async_optimizations:
      title: "异步优化暂不支持计费请求头"
      detail: "异步优化请求不能携带计费 charge header。"
      remediation: "移除计费请求头，或改用同步优化流程。"
    billing_not_supported_for_predictions:
      title: "预测暂不支持计费请求头"
      detail: "预测请求当前不接受计费 charge header。"
      remediation: "移除计费请求头后重新提交预测请求。"
    billing_not_supported_for_rerun:
      title: "重新运行不接受计费请求头"
      detail: "复现重新运行请求不能携带计费 charge header。"
      remediation: "移除计费请求头后重新提交 rerun 请求。"
    billing_reserve_failed:
      title: "计费预留失败"
      detail: "求解前计费预留未能成功完成。"
      remediation: "检查 Credits 余额、charge id 和计费服务状态后重试。"
    infeasible:
      title: "线性规划不可行"
      detail: "输入约束无法同时满足。"
      remediation: "检查约束矩阵、边界和业务规则后重新提交。"
    invalid_body:
      title: "请求体无效"
      detail: "该操作要求空请求体或特定请求体结构。"
      remediation: "按接口文档调整请求体后重试。"
    invalid_budget_request:
      title: "预算请求无效"
      detail: "预算请求未通过校验。"
      remediation: "检查预算金额、周期和账户上下文后重试。"
    invalid_execution_mode:
      title: "执行模式无效"
      detail: "mode 必须是支持的执行模式。"
      remediation: "使用 sync、async 或 teaching 中的有效模式。"
    invalid_job_template:
      title: "作业模板无效"
      detail: "作业模板版本或参数变更未通过校验。"
      remediation: "检查模板参数路径和值类型后重新保存。"
    invalid_lp_input:
      title: "线性规划输入无效"
      detail: "线性规划输入未通过字段或业务校验。"
      remediation: "检查目标函数、约束矩阵和变量边界后重试。"
    invalid_prediction_data:
      title: "预测数据无效"
      detail: "预测请求数据未通过字段校验。"
      remediation: "检查字段路径、取值范围和数据格式后重新提交。"
    invalid_request_body:
      title: "请求体校验失败"
      detail: "请求体未通过 schema 校验。"
      remediation: "根据 errors[] 中的 field_path 修正字段后重试。"
    invalid_uuid:
      title: "UUID 无效"
      detail: "请求中的 UUID 字段格式无效。"
      remediation: "提供合法 UUID 格式的字段值。"
    request_validation:
      title: "请求校验失败"
      detail: "FastAPI 请求校验未通过。"
      remediation: "根据 errors[] 中的字段路径和约束修正请求。"
    solver_error:
      title: "求解失败"
      detail: "求解器未能产出有效结果。"
      remediation: "检查输入模型，或尝试备用求解器后重试。"
    source_task_not_completed:
      title: "源任务未完成"
      detail: "只有已完成的优化或预测任务可以保存为模板。"
      remediation: "等待源任务完成后再创建或更新模板。"
    unbounded:
      title: "线性规划无界"
      detail: "目标函数在当前约束下无有限最优解。"
      remediation: "补充边界约束或检查目标函数方向。"
    unsupported_prediction_family:
      title: "不支持的预测模型族"
      detail: "预测 family 不在当前支持列表中。"
      remediation: "选择 arima 或 chronos 等已支持模型族。"
    unsupported_task_type:
      title: "不支持的任务类型"
      detail: "请求的 task_type 未在算法目录中启用。"
      remediation: "查看算法目录并选择已支持的 task_type。"
  429:
    rate_limit_exceeded:
      title: "请求频率超限"
      detail: "当前套餐的请求频率额度已用尽。"
      remediation: "稍后重试，或升级套餐以获得更高频率额度。"
  500:
    catalog_error:
      title: "算法目录错误"
      detail: "必需的算法目录条目不可用。"
      remediation: "保留 request_id 并联系支持排查目录配置。"
  501:
    not_implemented:
      title: "暂未实现"
      detail: "该 task_type 在当前里程碑暂未实现。"
      remediation: "选择已实现的任务类型，或关注后续版本。"
  503:
    billing_http_error:
      title: "计费服务暂不可用"
      detail: "计费服务暂时无法处理当前请求。"
      remediation: "稍后重试；若持续失败，请联系支持并提供 request_id。"
    rate_limit_unavailable:
      title: "限流服务暂不可用"
      detail: "系统暂时无法确认请求频率额度。"
      remediation: "稍后重试；若持续失败，请联系支持并提供 request_id。"
  504:
    solver_timeout:
      title: "求解超时"
      detail: "求解器超过了允许的运行时间。"
      remediation: "降低问题规模、增加 max_solve_seconds 或尝试备用求解器。"
  auth_frozen:
    appeal:
      title: "账户已冻结"
      detail: "账户已冻结，需要先完成申诉才能继续登录。"
      remediation: "打开冻结账户申诉流程，并提交所需验证信息。"
  billing_warning:
