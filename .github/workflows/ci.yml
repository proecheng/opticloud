    if: needs.changes.outputs.ui_a11y_audit == 'true' || needs.changes.outputs.ui == 'true' || needs.changes.outputs.ci_or_root == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install uv==${{ env.UV_VERSION }}
      - run: uv sync --all-packages --extra dev
      - name: Validate quarterly a11y audit contract
        run: uv run python scripts/validate_a11y_quarterly_audit.py
      - name: Validate real quarterly a11y evidence manifests when present
        run: |
          shopt -s globstar nullglob
          manifests=(reports/a11y-quarterly/**/audit_manifest.json)
          for manifest in "${manifests[@]}"; do
            uv run python scripts/validate_a11y_quarterly_audit.py --evidence "$manifest"
          done
      - name: Run quarterly a11y audit tests
        run: uv run pytest tests/test_a11y_quarterly_audit.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Run UI axe gate
        run: pnpm --filter @opticloud/ui test:a11y

